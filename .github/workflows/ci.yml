name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Pure-function tests only (see tests/): password rules, the encryption
      # helper used for stored SMTP/S3/OAuth secrets, the Formula property
      # language, and display-name fallback logic. No database, no network,
      # so this stays fast and cannot flake.
      - name: Test
        run: pnpm test

      # `next build` loads lib/env.ts (Zod-validated) at module-eval time, so
      # it needs syntactically valid values to succeed — it does NOT need a
      # reachable database. These match the placeholders already baked into
      # the Dockerfile's builder stage.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          APP_SECRET: docker-build-placeholder-override-at-runtime
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Catches the failure mode that breaks self-hosters most often: a schema
    # change committed without its generated migration, so the `migrate`
    # step (Dockerfile's `migrator` target, or `pnpm db:migrate` when running
    # from source) dies on a fresh install.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pagevo
          POSTGRES_PASSWORD: pagevo
          POSTGRES_DB: pagevo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pagevo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Uses the app's own migration runner (scripts/migrate.ts), the same
      # one the Dockerfile's `migrator` target and `pnpm db:migrate` use —
      # not drizzle-kit's built-in migrator, which wraps every migration in
      # one transaction and breaks on this project's ALTER TYPE ... ADD
      # VALUE migrations. Runs against the ephemeral service container
      # above only — nothing here can touch a real database.
      - name: Apply existing migrations to a fresh database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://pagevo:pagevo@localhost:5432/pagevo_ci

      - name: Fail if the schema has uncommitted migrations
        run: |
          pnpm db:generate
          if ! git diff --quiet --exit-code drizzle; then
            echo "::error::lib/db/schema changed without a generated migration."
            echo "Run 'pnpm db:generate' and commit the result in drizzle/."
            git diff --stat drizzle
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://pagevo:pagevo@localhost:5432/pagevo_ci
